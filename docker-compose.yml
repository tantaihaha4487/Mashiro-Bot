services:
  mashiro-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mashiro-bot
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?Set BOT_TOKEN in .env or your shell}"
      BOT_OWNER_ID: "${BOT_OWNER_ID:-}"
      WELCOME_ROLE_ID: "${WELCOME_ROLE_ID:-}"
      WELCOME_THUMBNAIL_URL: "${WELCOME_THUMBNAIL_URL:-}"
      WELCOME_BANNER_URL: "${WELCOME_BANNER_URL:-}"
      GOODBYE_THUMBNAIL_URL: "${GOODBYE_THUMBNAIL_URL:-}"
      GOODBYE_BANNER_URL: "${GOODBYE_BANNER_URL:-}"
      REPORTER_THUMBNAIL_URL: "${REPORTER_THUMBNAIL_URL:-}"
    restart: unless-stopped
