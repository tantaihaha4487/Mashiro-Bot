<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Mashiro Bot</title>
  <desc id="description">A soft lilac banner with a white shrine cat mascot and labels for welcome, goodbye, and ping features.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9fd"/>
      <stop offset="1" stop-color="#eee8ff"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8c78b4" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="36" fill="url(#background)"/>
  <circle cx="1040" cy="40" r="145" fill="#f9d9e9" opacity=".42"/>
  <circle cx="1138" cy="355" r="170" fill="#dcd3ff" opacity=".48"/>
  <circle cx="665" cy="52" r="6" fill="#d5a8d8"/>
  <path d="m732 73 5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#e7b4cb"/>
  <path d="m1090 100 4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#bdaeea"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="78" y="70" width="254" height="36" rx="18" fill="#ffffff" opacity=".82"/>
    <circle cx="98" cy="88" r="5" fill="#e59cb9"/>
    <text x="113" y="94" font-size="13" font-weight="700" letter-spacing="1.7" fill="#76668f">A LITTLE MAGIC FOR YOUR SERVER</text>
    <text x="76" y="182" font-size="62" font-weight="750" letter-spacing="-2.5" fill="#332b46">Mashiro Bot</text>
    <text x="80" y="226" font-size="20" fill="#675d79">Friendly greetings, quick ping checks,</text>
    <text x="80" y="255" font-size="20" fill="#675d79">and a tiny bit of shrine-cat charm.</text>

    <g font-size="12" font-weight="750" letter-spacing="1.2">
      <rect x="80" y="294" width="126" height="38" rx="19" fill="#ffffff"/>
      <text x="143" y="318" text-anchor="middle" fill="#98718f">WELCOME</text>
      <rect x="218" y="294" width="126" height="38" rx="19" fill="#ffffff"/>
      <text x="281" y="318" text-anchor="middle" fill="#8574a7">GOODBYE</text>
      <rect x="356" y="294" width="94" height="38" rx="19" fill="#e7dffd"/>
      <text x="403" y="318" text-anchor="middle" fill="#67568f">/PING</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="60" width="318" height="285" rx="34" fill="#ffffff" opacity=".76"/>
    <rect x="808" y="86" width="262" height="44" rx="18" fill="#f8f3ff"/>
    <circle cx="832" cy="108" r="7" fill="#8fc9ad"/>
    <text x="850" y="113" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#675d79">MASHIRO IS HERE</text>
  </g>

  <g transform="translate(836 117)">
    <path d="M28 76 38 8q2-13 13-4l40 35q32-14 65-1l40-34q11-9 13 4l10 68q19 24 17 58-4 76-107 77T21 134q-1-35 7-58Z" fill="url(#fur)" stroke="#d7cce9" stroke-width="4" stroke-linejoin="round"/>
    <path d="m48 20 30 27q-24 4-43 19zM194 20l-30 27q24 4 43 19z" fill="#f2bdd3"/>
    <path d="M85 104q17-21 33 0-16 19-33 0ZM137 104q17-21 33 0-16 19-33 0Z" fill="#776b9d"/>
    <circle cx="103" cy="102" r="4" fill="#fff"/>
    <circle cx="155" cy="102" r="4" fill="#fff"/>
    <path d="M121 121q7-7 14 0-7 9-14 0Z" fill="#e99ebc"/>
    <path d="M128 131q-8 10-17 2m17-2q8 10 17 2" fill="none" stroke="#9b83a7" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="73" cy="125" rx="13" ry="7" fill="#f2bfd2" opacity=".72"/>
    <ellipse cx="187" cy="125" rx="13" ry="7" fill="#f2bfd2" opacity=".72"/>
    <path d="M66 119 27 113m39 21-40 1m134-16 39-6m-39 21 40 1" fill="none" stroke="#c7bad8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M109 178q19 9 38 0l-3 14q-17 11-33 0z" fill="#e6a7c4"/>
    <circle cx="128" cy="190" r="5" fill="#f5d889"/>
  </g>

  <path d="m1124 156 5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#d9abd1"/>
  <path d="m748 296 4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#c4b5eb"/>
</svg>
